name: Проверка бота и канала

on:
  workflow_dispatch:
  push:
    paths:
      - bot/check.py
      - .github/workflows/check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@VirtualBiznesChannel"
        run: python3 bot/check.py
