name: Поставить аватар канала

on:
  workflow_dispatch:

jobs:
  avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Загрузить аватар в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@VirtualBiznesChannel"
        run: python3 bot/set_avatar.py
