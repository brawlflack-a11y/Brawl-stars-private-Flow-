name: Публикация поста в Telegram

on:
  schedule:
    - cron: "0 15 * * *" # 18:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Опубликовать следующий пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "@VirtualBiznesChannel"
        run: python3 bot/post.py

      - name: Сохранить список опубликованных постов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add bot/state.json
          git diff --cached --quiet || git commit -m "Опубликован очередной пост"
          git push
