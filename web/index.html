<title>Flow Арена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
  /* Layout: a single arcade screen — header strip, square arena, controls hint. One dark world by choice. */
  :root {
    --night: #171a2e;
    --floor: #232845;
    --tile: #2a3052;
    --wall: #48507c;
    --wall-top: #6670a3;
    --ink: #eef0ff;
    --muted: #9aa1c9;
    --blue: #3fb6ff;
    --red: #ff5d6c;
    --gold: #ffd23f;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Rubik", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--gold); }
  .trophies {
    font-weight: 800; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 6px;
    background: var(--floor); padding: 6px 12px; border-radius: 999px;
  }
  .trophies svg { width: 18px; height: 18px; fill: var(--gold); }
  .hud {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .hud .a { color: var(--blue); }
  .hud .b { color: var(--red); text-align: right; }
  .hud .time { font-family: var(--display); font-size: 1.3rem; }
  .stage { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; }
  canvas {
    width: 100%; height: 100%; display: block; border-radius: 14px;
    touch-action: none; background: var(--floor);
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: color-mix(in srgb, var(--night) 78%, transparent);
    border-radius: 14px; padding: 16px;
  }
  .overlay h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 8vw, 3rem); margin: 0; text-wrap: balance; }
  .overlay p { margin: 0; color: var(--muted); max-width: 34ch; line-height: 1.45; }
  .overlay .delta { font-weight: 800; font-size: 1.3rem; color: var(--gold); }
  button {
    font-family: var(--display); font-size: 1.2rem; color: var(--night);
    background: var(--gold); border: 0; border-radius: 12px; padding: 12px 28px;
    box-shadow: 0 5px 0 #b8901c; cursor: pointer;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8901c; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .help { color: var(--muted); font-size: .85rem; line-height: 1.5; display: flex; gap: 16px; flex-wrap: wrap; }
  .help b { color: var(--ink); font-weight: 600; }
</style>

<div class="wrap">
  <header>
    <h1>Flow <span>Арена</span></h1>
    <div class="trophies" title="Трофеи">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h4v3a5 5 0 0 1-5 5h-.3A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.3 13H8a5 5 0 0 1-5-5V5h4zm0 4H5v1a3 3 0 0 0 2 2.8zm10 0v3.8A3 3 0 0 0 19 8V7z"/></svg>
      <span id="trophies">0</span>
    </div>
  </header>
  <div class="hud">
    <div class="a" id="aliveA">Синие: 3</div>
    <div class="time" id="time">2:00</div>
    <div class="b" id="aliveB">Красные: 3</div>
  </div>
  <div class="stage">
    <canvas id="game" aria-label="Игровое поле"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">3 на 3</h2>
      <p id="ovText">Ты в синей команде. Выбей всех красных за 2 минуты. Победа +8 трофеев, поражение −4.</p>
      <div class="delta" id="ovDelta" hidden></div>
      <button id="play" type="button">В бой</button>
    </div>
  </div>
  <div class="help">
    <span><b>Компьютер:</b> WASD — ходить, мышь — целиться, клик или пробел — стрелять</span>
    <span><b>Телефон:</b> левая половина — ходить, правая — тянуть и стрелять, тап — авто-выстрел</span>
  </div>
</div>

<script>
(() => {
  // Те же правила, что у сервера (server/battle.py)
  const MAP = 600, PLAYER_SPEED = 150, PLAYER_R = 15, MAX_HP = 100;
  const BULLET_SPEED = 400, BULLET_R = 5, BULLET_RANGE = 300, DAMAGE = 25, COOLDOWN = 0.5;
  const DURATION = 120, TROPHY_WIN = 8, TROPHY_LOSS = -4;
  const WALLS = [
    { x: 270, y: 240, w: 60, h: 120 },
    { x: 150, y: 110, w: 90, h: 30 }, { x: 360, y: 460, w: 90, h: 30 },
    { x: 150, y: 460, w: 90, h: 30 }, { x: 360, y: 110, w: 90, h: 30 },
    { x: 110, y: 270, w: 30, h: 60 }, { x: 460, y: 270, w: 30, h: 60 },
  ];
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {
    floor: css("--floor"), tile: css("--tile"), wall: css("--wall"), wallTop: css("--wall-top"),
    ink: css("--ink"), blue: css("--blue"), red: css("--red"), gold: css("--gold"), night: css("--night"),
  };
  const TEAM_COLOR = [C.blue, C.red];

  const $ = id => document.getElementById(id);
  const canvas = $("game"), ctx = canvas.getContext("2d");
  const overlay = $("overlay");

  let trophies = 0;
  try { trophies = parseInt(localStorage.getItem("flow-trophies") || "0", 10) || 0; } catch (e) {}
  const hotData = window.claude?.hot?.data;
  if (hotData && typeof hotData.trophies === "number") trophies = hotData.trophies;
  window.claude?.hot?.snapshot?.(() => ({ trophies }));
  const saveTrophies = () => {
    $("trophies").textContent = trophies;
    try { localStorage.setItem("flow-trophies", String(trophies)); } catch (e) {}
  };
  saveTrophies();

  let state = null;   // текущий матч
  let running = false;

  function newMatch() {
    const players = [];
    for (let slot = 0; slot < 6; slot++) {
      const team = slot % 2, index = slot >> 1;
      players.push({
        slot, team, hp: MAX_HP, cooldown: 0, human: slot === 0,
        x: team === 0 ? 50 : MAP - 50, y: MAP / 2 + (index - 1) * 80,
        dx: 0, dy: 0, shoot: false, angle: team === 0 ? 0 : 180,
        stuck: 0, wander: 0, wdx: 0, wdy: 0, lastX: 0, lastY: 0, aimJitter: 0,
      });
    }
    return { players, bullets: [], timeLeft: DURATION, winner: null };
  }

  // --- физика ---
  function pushOutOfWalls(p) {
    for (const w of WALLS) {
      const cx = Math.max(w.x, Math.min(p.x, w.x + w.w));
      const cy = Math.max(w.y, Math.min(p.y, w.y + w.h));
      let ox = p.x - cx, oy = p.y - cy;
      const d = Math.hypot(ox, oy);
      if (d < PLAYER_R) {
        if (d === 0) { ox = p.x < w.x + w.w / 2 ? -1 : 1; oy = 0; }
        const len = Math.hypot(ox, oy);
        p.x = cx + ox / len * PLAYER_R;
        p.y = cy + oy / len * PLAYER_R;
      }
    }
  }
  const inWall = (x, y) => WALLS.some(w => x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h);
  function lineBlocked(a, b) {
    const steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 10);
    for (let i = 1; i < steps; i++) {
      if (inWall(a.x + (b.x - a.x) * i / steps, a.y + (b.y - a.y) * i / steps)) return true;
    }
    return false;
  }

  function step(dt) {
    const s = state;
    s.timeLeft -= dt;
    for (const p of s.players) {
      if (p.hp <= 0) continue;
      if (!p.human) think(p, dt);
      const len = Math.hypot(p.dx, p.dy);
      if (len) {
        p.x += p.dx / len * PLAYER_SPEED * dt;
        p.y += p.dy / len * PLAYER_SPEED * dt;
        p.x = Math.max(PLAYER_R, Math.min(MAP - PLAYER_R, p.x));
        p.y = Math.max(PLAYER_R, Math.min(MAP - PLAYER_R, p.y));
        pushOutOfWalls(p);
      }
      p.cooldown = Math.max(0, p.cooldown - dt);
      if (p.shoot && p.cooldown === 0) {
        p.cooldown = COOLDOWN;
        const r = p.angle * Math.PI / 180;
        s.bullets.push({ team: p.team, x: p.x, y: p.y, vx: Math.cos(r) * BULLET_SPEED, vy: Math.sin(r) * BULLET_SPEED, t: 0 });
      }
    }
    s.bullets = s.bullets.filter(b => {
      b.x += b.vx * dt; b.y += b.vy * dt; b.t += BULLET_SPEED * dt;
      if (b.t > BULLET_RANGE || b.x < 0 || b.y < 0 || b.x > MAP || b.y > MAP || inWall(b.x, b.y)) return false;
      const hit = s.players.find(p => p.hp > 0 && p.team !== b.team && Math.hypot(p.x - b.x, p.y - b.y) <= PLAYER_R + BULLET_R);
      if (hit) { hit.hp = Math.max(0, hit.hp - DAMAGE); hit.flash = 0.12; return false; }
      return true;
    });
    for (const p of s.players) if (p.flash) p.flash = Math.max(0, p.flash - dt);

    const alive = [0, 1].map(t => s.players.filter(p => p.team === t && p.hp > 0).length);
    if (alive[0] === 0 || alive[1] === 0 || s.timeLeft <= 0) {
      s.winner = alive[0] === alive[1] ? -1 : (alive[0] > alive[1] ? 0 : 1);
    }
  }

  // --- боты: идут к ближайшему врагу и стреляют, когда он в зоне досягаемости ---
  function think(p, dt) {
    const enemies = state.players.filter(e => e.team !== p.team && e.hp > 0);
    if (!enemies.length) { p.dx = p.dy = 0; p.shoot = false; return; }
    const t = enemies.reduce((a, b) => Math.hypot(a.x - p.x, a.y - p.y) < Math.hypot(b.x - p.x, b.y - p.y) ? a : b);
    const dist = Math.hypot(t.x - p.x, t.y - p.y);
    const blocked = lineBlocked(p, t);

    p.aimJitter += (Math.random() - 0.5) * 160 * dt;
    p.aimJitter = Math.max(-16, Math.min(16, p.aimJitter));
    p.angle = Math.atan2(t.y - p.y, t.x - p.x) * 180 / Math.PI + p.aimJitter;

    if (Math.hypot(p.x - p.lastX, p.y - p.lastY) < 1 && (p.dx || p.dy)) p.stuck += dt; else p.stuck = 0;
    p.lastX = p.x; p.lastY = p.y;
    if (p.stuck > 0.4) { p.wander = 0.6; p.wdx = Math.random() < .5 ? -1 : 1; p.wdy = Math.random() < .5 ? -1 : 1; p.stuck = 0; }

    if (p.wander > 0) {
      p.wander -= dt; p.dx = p.wdx; p.dy = p.wdy;
    } else if (dist < BULLET_RANGE * 0.6 && !blocked) {
      if (Math.random() < dt * 1.5) { p.wdx = 0; p.wdy = [-1, 0, 1][Math.floor(Math.random() * 3)]; }
      p.dx = p.wdx; p.dy = p.wdy;
    } else {
      const sg = v => (v > 5) - (v < -5);
      p.dx = sg(t.x - p.x); p.dy = sg(t.y - p.y);
    }
    // бот замечает цель не сразу и иногда делает паузу между очередями
    p.react = (p.react || 0) + dt;
    if (Math.random() < dt * 0.6) p.react = -0.8;
    p.shoot = dist < BULLET_RANGE * 0.9 && !blocked && p.react > 0.4;
  }

  // --- управление ---
  const keys = new Set();
  const mouse = { x: 0, y: 0, down: false, active: false };
  const touch = { move: null, aim: null };
  let tapShot = false;

  const toWorld = (cx, cy) => {
    const r = canvas.getBoundingClientRect();
    return { x: (cx - r.left) / r.width * MAP, y: (cy - r.top) / r.height * MAP };
  };
  addEventListener("keydown", e => {
    if (!running) return;
    keys.add(e.code);
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  });
  addEventListener("keyup", e => keys.delete(e.code));
  addEventListener("blur", () => { keys.clear(); mouse.down = false; });

  canvas.addEventListener("pointerdown", e => {
    if (!running) return;
    const w = toWorld(e.clientX, e.clientY);
    if (e.pointerType === "mouse") {
      mouse.down = true; mouse.active = true; Object.assign(mouse, w); return;
    }
    canvas.setPointerCapture(e.pointerId);
    const side = w.x < MAP / 2 ? "move" : "aim";
    if (!touch[side]) touch[side] = { id: e.pointerId, ox: w.x, oy: w.y, x: w.x, y: w.y, t: performance.now() };
  });
  canvas.addEventListener("pointermove", e => {
    const w = toWorld(e.clientX, e.clientY);
    if (e.pointerType === "mouse") { Object.assign(mouse, w); mouse.active = true; return; }
    for (const side of ["move", "aim"]) if (touch[side]?.id === e.pointerId) Object.assign(touch[side], w);
  });
  const endPointer = e => {
    if (e.pointerType === "mouse") { mouse.down = false; return; }
    if (touch.aim?.id === e.pointerId) {
      const a = touch.aim;
      if (Math.hypot(a.x - a.ox, a.y - a.oy) < 12 && performance.now() - a.t < 300) tapShot = true;
      touch.aim = null;
    }
    if (touch.move?.id === e.pointerId) touch.move = null;
  };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  function nearestEnemyAngle(p) {
    const enemies = state.players.filter(e => e.team !== p.team && e.hp > 0);
    if (!enemies.length) return p.angle;
    const t = enemies.reduce((a, b) => Math.hypot(a.x - p.x, a.y - p.y) < Math.hypot(b.x - p.x, b.y - p.y) ? a : b);
    return Math.atan2(t.y - p.y, t.x - p.x) * 180 / Math.PI;
  }

  function readHuman() {
    const p = state.players[0];
    let dx = 0, dy = 0;
    if (keys.has("KeyA") || keys.has("ArrowLeft")) dx -= 1;
    if (keys.has("KeyD") || keys.has("ArrowRight")) dx += 1;
    if (keys.has("KeyW") || keys.has("ArrowUp")) dy -= 1;
    if (keys.has("KeyS") || keys.has("ArrowDown")) dy += 1;
    p.shoot = false;

    if (touch.move) {
      const mx = touch.move.x - touch.move.ox, my = touch.move.y - touch.move.oy;
      if (Math.hypot(mx, my) > 8) { dx = mx; dy = my; }
    }
    p.dx = dx; p.dy = dy;

    if (touch.aim) {
      const ax = touch.aim.x - touch.aim.ox, ay = touch.aim.y - touch.aim.oy;
      if (Math.hypot(ax, ay) > 12) { p.angle = Math.atan2(ay, ax) * 180 / Math.PI; p.shoot = true; }
    } else if (mouse.active) {
      p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x) * 180 / Math.PI;
      p.shoot = mouse.down;
    }
    if (keys.has("Space") || tapShot) {
      if (!touch.aim && !mouse.down) p.angle = nearestEnemyAngle(p);
      p.shoot = true;
      tapShot = false;
    }
  }

  // --- отрисовка ---
  let scale = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    scale = canvas.width / MAP;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = C.floor;
    ctx.fillRect(0, 0, MAP, MAP);
    ctx.fillStyle = C.tile;
    for (let x = 0; x < MAP; x += 40) for (let y = 0; y < MAP; y += 40) {
      if (((x + y) / 40) % 2 === 0) ctx.fillRect(x, y, 40, 40);
    }
    // зоны появления
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = C.blue; ctx.fillRect(0, 0, 90, MAP);
    ctx.fillStyle = C.red; ctx.fillRect(MAP - 90, 0, 90, MAP);
    ctx.globalAlpha = 1;

    for (const w of WALLS) {
      ctx.fillStyle = C.wall; ctx.fillRect(w.x, w.y + 6, w.w, w.h - 6);
      ctx.fillStyle = C.wallTop; ctx.fillRect(w.x, w.y, w.w, w.h - 6);
    }
    if (!state) return;

    for (const b of state.bullets) {
      ctx.fillStyle = TEAM_COLOR[b.team];
      ctx.beginPath(); ctx.arc(b.x, b.y, BULLET_R, 0, Math.PI * 2); ctx.fill();
    }

    for (const p of state.players) {
      if (p.hp <= 0) {
        ctx.globalAlpha = 0.25; ctx.fillStyle = TEAM_COLOR[p.team];
        ctx.beginPath(); ctx.arc(p.x, p.y, PLAYER_R * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; continue;
      }
      if (p.human) {
        const r = p.angle * Math.PI / 180;
        ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.25; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + Math.cos(r) * BULLET_RANGE, p.y + Math.sin(r) * BULLET_RANGE); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.beginPath(); ctx.ellipse(p.x, p.y + PLAYER_R * 0.8, PLAYER_R, PLAYER_R * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = p.flash ? C.ink : TEAM_COLOR[p.team];
      ctx.beginPath(); ctx.arc(p.x, p.y, PLAYER_R, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = p.human ? C.gold : C.night; ctx.stroke();
      // ствол
      const r = p.angle * Math.PI / 180;
      ctx.strokeStyle = C.night; ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(p.x + Math.cos(r) * 6, p.y + Math.sin(r) * 6);
      ctx.lineTo(p.x + Math.cos(r) * (PLAYER_R + 6), p.y + Math.sin(r) * (PLAYER_R + 6)); ctx.stroke();
      // полоска здоровья
      ctx.fillStyle = C.night; ctx.fillRect(p.x - 18, p.y - 30, 36, 6);
      ctx.fillStyle = p.team === 0 ? C.blue : C.red; ctx.fillRect(p.x - 17, p.y - 29, 34 * p.hp / MAX_HP, 4);
      if (p.human) {
        ctx.fillStyle = C.gold; ctx.font = "bold 11px Rubik, sans-serif"; ctx.textAlign = "center";
        ctx.fillText("ТЫ", p.x, p.y - 34);
      }
    }

    // джойстики на телефоне
    for (const j of [touch.move, touch.aim]) {
      if (!j) continue;
      ctx.globalAlpha = 0.35; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(j.ox, j.oy, 40, 0, Math.PI * 2); ctx.stroke();
      const dx = j.x - j.ox, dy = j.y - j.oy, d = Math.hypot(dx, dy), k = d > 40 ? 40 / d : 1;
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(j.ox + dx * k, j.oy + dy * k, 16, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function updateHud() {
    const s = state;
    const alive = t => s ? s.players.filter(p => p.team === t && p.hp > 0).length : 3;
    $("aliveA").textContent = `Синие: ${alive(0)}`;
    $("aliveB").textContent = `Красные: ${alive(1)}`;
    const t = Math.max(0, Math.ceil(s ? s.timeLeft : DURATION));
    $("time").textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
  }

  function finish() {
    running = false;
    const w = state.winner;
    let title, delta;
    if (w === -1) { title = "Ничья"; delta = 0; }
    else if (w === 0) { title = "Победа!"; delta = TROPHY_WIN; }
    else { title = "Поражение"; delta = TROPHY_LOSS; }
    const before = trophies;
    trophies = Math.max(0, trophies + delta);
    saveTrophies();
    $("ovTitle").textContent = title;
    $("ovText").textContent = state.players[0].hp > 0 ? "Ты дожил до конца матча." : "Тебя выбили, но команда продолжала бой.";
    const real = trophies - before;
    $("ovDelta").textContent = `${real >= 0 ? "+" : "−"}${Math.abs(real)} трофеев`;
    $("ovDelta").hidden = false;
    $("play").textContent = "Ещё раз";
    overlay.hidden = false;
    $("play").focus();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (running) {
      readHuman();
      step(dt);
      if (state.winner !== null) finish();
    }
    draw();
    updateHud();
    requestAnimationFrame(frame);
  }

  $("play").addEventListener("click", () => {
    state = newMatch();
    keys.clear(); touch.move = touch.aim = null; mouse.down = false;
    overlay.hidden = true;
    running = true;
  });

  state = newMatch();  // поле видно сразу, до начала боя
  requestAnimationFrame(frame);
})();
</script>
